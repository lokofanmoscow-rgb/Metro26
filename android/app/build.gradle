plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.metro26.game'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.metro26.game'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    signingConfigs {
        release {
            // Ключ подписи любительской сборки лежит в репозитории, чтобы обновления
            // ставились поверх старой версии. Для публикации в магазине создайте свой ключ.
            storeFile file('../metro26.jks')
            storePassword 'metro26'
            keyAlias 'metro26'
            keyPassword 'metro26'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Игра собирается в один файл dist/index.html (npm run build) и кладётся в assets
tasks.register('copyGame', Copy) {
    from("${rootDir}/../dist/index.html")
    into("${projectDir}/src/main/assets")
}
preBuild.dependsOn('copyGame')
